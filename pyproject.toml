[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denoise-harness"
version = "0.1.0"
description = "Cross-agent harness for reproducible scientific image denoising"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
    "scikit-image>=0.20",
]

[project.urls]
Homepage = "https://github.com/jiadongdan/denoise-harness"
Repository = "https://github.com/jiadongdan/denoise-harness.git"
Issues = "https://github.com/jiadongdan/denoise-harness/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
denoise = "denoise_harness.cli:main"
denoise-harness = "denoise_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
